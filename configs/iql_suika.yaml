data:
  # 必须对应初始化 BC 模型的原始固定划分；IQL 不创建新划分。
  directory: ../soku_cql/data/replay_shards_resources_v4_mirror
  split_file: ../soku_cql/data/replay_shards_resources_v4_mirror/train_val_split.json
  cache_gb: 8.0
training:
  device: auto
  batch_size: 16
  sequence_length: 32
  burn_in: 31
  total_steps: 100000
  amp: true
  prefetch_batches: 2
  log_interval: 20
  save_interval: 1000
  validation_interval: 1000
  validation_batches: 20
iql:
  gamma: 0.99
  expectile: 0.7
  advantage_beta: 3.0
  max_weight: 100.0
  target_tau: 0.005
  actor_lr: 0.0001
  critic_lr: 0.0003
  value_lr: 0.0003
  actor_warmup_steps: 1000
reward:
  damage_dealt: 0.001
  damage_taken: 0.001
output:
  directory: outputs/iql_suika
