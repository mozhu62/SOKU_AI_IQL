data:
  # 必须对应初始化 BC 模型的原始固定划分；IQL 不创建新划分。
  directory: ../replay_shards_resources_v4_mirror
  split_file: ../replay_shards_resources_v4_mirror/train_val_split.json
  cache_gb: 32.0
training:
  device: cuda
  batch_size: 64
  sequence_length: 32
  burn_in: 255
  total_steps: 100000
  amp: true
  prefetch_batches: 4
  log_interval: 20
  save_interval: 1000
  validation_interval: 1000
  validation_batches: 20
  replays_per_batch: 8
  cpu_threads: 4
iql:
  n_step: 1
  gamma: 0.99
  expectile: 0.7
  advantage_beta: 3.0
  max_weight: 100.0
  target_tau: 0.005
  actor_lr: 0.0001
  critic_lr: 0.0003
  value_lr: 0.0003
  actor_warmup_steps: 100000
actor_sampling:
  # 仅限制 Actor 有效监督帧；方向 5 且 ABCD 全松开才是 Neutral。
  enabled: false
  neutral_max_fraction: 0.05
actor_weighting:
  # 全部有效帧照常监督，仅降低 Neutral 相对损失权重。
  enabled: true
  neutral_weight: 0.05
reward:
  # 小局 KO 终局额外奖励；loss 填正数，计算时扣除。
  win: 10.0
  loss: 10.0
  damage_dealt: 0.01
  damage_taken: 0.01
output:
  directory: outputs/iql_suika_tcn256
