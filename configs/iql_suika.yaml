data:
  # 可使用独立于 BC 的 IQL 数据与验证集；split_file 必须覆盖当前目录全部 NPZ。
  directory: ../replay_cards_reimu_training_big_mirror
  split_file: ../replay_cards_reimu_training_big_mirror/train_val_split.json
  # 服务器按约 128GB 内存配置：给系统、Python 临时数组和 pinned batch 保留约 48GB。
  cache_gb: 32.0
training:
  # 当前训练器为单进程单卡；显式固定主卡，避免服务器默认 CUDA 设备变化。
  device: cuda:0
  batch_size: 96
  sequence_length: 32
  burn_in: 255
  total_steps: 100000
  amp: true
  # 后台批次会使用 pinned memory 并提前上传显存；4 批可吸收偶发 NPZ 缓存未命中。
  prefetch_batches: 4
  log_interval: 20
  save_interval: 2000
  validation_interval: 2000
  validation_batches: 20
  replays_per_batch: 12
  cpu_threads: 8
iql:
  # 恢复IQL优势加权，与下方关键帧权重相乘；保留Actor从第一步更新。
  actor_advantage_weighting: true
  # 8 步折扣回报；终局提前停止，片段截断只从最后真实后继状态 bootstrap。
  n_step: 1
  gamma: 0.999165
  expectile: 0.5
  advantage_beta: 1.0
  max_weight: 100.0
  target_tau: 0.005
  actor_lr: 0.0001
  critic_lr: 0.0003
  value_lr: 0.0003
  actor_warmup_steps: 1000
keyframe_weighting:
  enabled: true
  changepoint_weight: 24.0
actor_sampling:
  # 关键帧采用损失加权，不筛除保持帧。
  # 仅限制 Actor 有效监督帧；方向 5 且 ABCD 全松开才是 Neutral。
  enabled: false
  neutral_max_fraction: 0.05
actor_weighting:
  # 全部有效帧照常监督，仅降低 Neutral 相对损失权重。
  enabled: false
  neutral_weight: 0.05
reward:
  # 小局 KO 终局额外奖励；loss 填正数，计算时扣除。
  win: 10.0
  loss: 10.0
  # 对手防御且灵力下降时，每个有效转移奖励一次；不把单纯举盾计为压制。
  pressure: 1.0
  # 水平距离超过 300 后，每个有效转移持续扣除一个微小固定值。
  far_distance_threshold: 300.0
  far_distance_penalty: 0.0
  damage_dealt: 0.001
  damage_taken: 0.001
output:
  # 新增压制奖励和远距离惩罚，使用独立目录，避免覆盖旧实验。
  directory: outputs/iql_suika_tcn256_pressure_far_v1
