data:
  # 可使用独立于 BC 的 IQL 数据与验证集；split_file 必须覆盖当前目录全部 NPZ。
  directory: ../replay_cards_reimu_training_big_mirror
  split_file: ../replay_cards_reimu_training_big_mirror/train_val_split.json
  cache_gb: 32.0
training:
  device: cuda
  batch_size: 64
  sequence_length: 32
  burn_in: 255
  total_steps: 100000
  amp: true
  prefetch_batches: 4
  log_interval: 20
  save_interval: 1000
  validation_interval: 1000
  validation_batches: 20
  replays_per_batch: 8
  cpu_threads: 4
iql:
  # 恢复IQL优势加权，与下方关键帧权重相乘；保留Actor从第一步更新。
  actor_advantage_weighting: true
  n_step: 8
  gamma: 0.999165
  expectile: 0.7
  advantage_beta: 1.0
  max_weight: 100.0
  target_tau: 0.005
  actor_lr: 0.0001
  critic_lr: 0.0003
  value_lr: 0.0003
  actor_warmup_steps: 1000
keyframe_weighting:
  enabled: true
  changepoint_weight: 24.0
actor_sampling:
  # 关键帧采用损失加权，不筛除保持帧。
  # 仅限制 Actor 有效监督帧；方向 5 且 ABCD 全松开才是 Neutral。
  enabled: false
  neutral_max_fraction: 0.05
actor_weighting:
  # 全部有效帧照常监督，仅降低 Neutral 相对损失权重。
  enabled: false
  neutral_weight: 0.05
reward:
  # 小局 KO 终局额外奖励；loss 填正数，计算时扣除。
  win: 10.0
  loss: 10.0
  damage_dealt: 0.001
  damage_taken: 0.001
output:
  directory: outputs/iql_suika_tcn256
